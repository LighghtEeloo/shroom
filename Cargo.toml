[workspace]
members = ["crates/shroom-app", "crates/shroom-core", "crates/shroom-integrations", "crates/shroom-lume"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
derive_more = { version = "2", features = ["display"] }
freya = { version = "0.4.3", features = ["icons-lucide"] }
freya-testing = "0.4.3"
microsandbox = { git = "https://github.com/superradcompany/microsandbox", rev = "e9565401dacde7e5c3a8fb935574c785aa1bc8f1", default-features = false, features = ["local", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shroom-core = { path = "crates/shroom-core" }
shroom-integrations = { path = "crates/shroom-integrations" }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
