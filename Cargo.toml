[workspace]
members = ["crates/shroom-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
derive_more = { version = "2", features = ["display"] }
microsandbox = { git = "https://github.com/superradcompany/microsandbox", rev = "e9565401dacde7e5c3a8fb935574c785aa1bc8f1", default-features = false, features = ["local", "net"] }
serde_json = "1"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
